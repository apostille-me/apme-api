[package]
name = "apme-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Axum REST and WebSocket API server for Apostille Me."
repository = "https://github.com/apostille-me/apme-api"
publish = false

[features]
default = ["tcp-transport", "nats-transport"]
tcp-transport = ["dep:bytes", "dep:rustls-pemfile", "dep:tokio-rustls", "dep:tokio-util"]
nats-transport = ["dep:async-nats", "dep:bytes"]

[dependencies]
anyhow = "1"
async-nats = { version = "0.45", optional = true }
axum = { version = "0.8", features = ["json", "macros", "ws"] }
bytes = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
# Immutable green commit; replace with a released tag after provenance review.
apme-interfaces = { git = "https://github.com/apostille-me/apme-interfaces", rev = "75896f9464f2fdbdec557411a642483105cfabd1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "ca176fb6768a9750d262a536952268625ffd3a8a" }
rustls-pemfile = { version = "2", optional = true }
sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-uuid"] }
shared-auth-client = { git = "https://github.com/shared-auth/shared-auth-clients.git", rev = "cc57a85b276bee81ad94decc87df2f48d49cab9f" }
shared-auth-lib = { git = "https://github.com/shared-auth/shared-auth-lib", rev = "4972cfd4eee43ddd9130b9c846caff1c5da7ae95" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", optional = true }
tokio-util = { version = "0.7", features = ["codec"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
