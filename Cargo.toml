[package]
name = "apme-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Axum REST and WebSocket API server for Apostille Me."
repository = "https://github.com/apostille-me/apme-api"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
# Immutable green commit; replace with a released tag after provenance review.
apme-interfaces = { git = "https://github.com/apostille-me/apme-interfaces", rev = "3178bccc6cb1e83b155f54e543a83dceda6fe192" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
