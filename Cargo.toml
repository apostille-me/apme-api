[package]
name = "apme-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Axum REST and WebSocket API server for Apostille Me."
repository = "https://github.com/apostille-me/apme-api"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
# Immutable green commit; replace with a released tag after provenance review.
apme-interfaces = { git = "https://github.com/apostille-me/apme-interfaces", rev = "75896f9464f2fdbdec557411a642483105cfabd1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shared-auth-client = { git = "https://github.com/shared-auth/shared-auth-clients", rev = "7aab653a1822e26122a16f8d31e501815fe86beb" }
shared-auth-lib = { git = "https://github.com/shared-auth/shared-auth-lib", rev = "4972cfd4eee43ddd9130b9c846caff1c5da7ae95" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
