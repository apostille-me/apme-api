[package]
org = "apostille-me"
name = "apme-api"
version = "0.1.0"
description = "Rust API server for Apostille Me"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apme-api"

[install]
dir = ".vendor/.zed"

[dependencies]
"apostille-me/apme-interfaces" = "^0.1.0"
"apostille-me/apme-libs" = "^0.1.0"
"apostille-me/apme-sync" = "^0.1.0"
"oresoftware/next-loggers" = "=0.1.0"
"shared-auth/shared-auth-clients" = "=0.1.0"

[targets.rust]
dir = "."
adapter = "none"

[scripts]
test = "cargo fmt --all -- --check && cargo test --all-targets --all-features --locked && cargo clippy --all-targets --all-features --locked -- -D warnings"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]
